openapi: 3.1.0

info:
  title: Eligibility API v1
  version: '1.1'
  description: |
    The Eligibility API provides tools to enhance logistics operations, including delivery coverage checks,
    smart window configurations, and address confidence scoring. It is designed to integrate seamlessly
    with various provider services and supports customizable orchestration rules for tailored responses.

    **Key Business Values**
    - Enables accurate delivery coverage checks across locations and providers.
    - Supports flexible scheduling through smart window configuration for pickup, delivery, and returns.
    - Improves address quality and fulfillment confidence with address confidence scoring.
    - Helps businesses optimize logistics workflows through configurable orchestration and provider integrations.

servers:
  - url: https://api.lynkup.com/api/eligibility/{version}
    description: Integration hub Production OAuth.
    variables:
      version:
       default: v1
       enum:
         - v1

tags:
  - name: "Delivery-Coverage"
    description: "Endpoints related to checking delivery coverage based on location and provider availability"
  - name: "Smart-Windows"
    description: "Smart Windows enables customers to manage their store timings, their pick-and-pack lead time windows, and associated pick-and-pack capacity and cost. It also allows customers to choose suitable windows for pick-up/delivery."
  - name: "Address-Confidence"
    description: "Endpoints for assessing confidence scores and validating drop-off addresses for logistics operations."
security:
  - OAuth2ClientCredentials: []

paths:
  /smart-windows: 
    post:
      summary: Retrieve available pick-up or delivery time windows for a specific location, with optional filtering by provider.
      description: |
        The Smart Windows API allows customers to view configurable time windows for pick-up or delivery based on the specified category, date, and location. This API supports configurations for pick-and-pack lead times, packing times, and associated capacities and costs.
        Time windows can be configured at the Business, Brand, or Location level, and the API provides up to 7 days of time windows. Optionally, the request can include a provider name to retrieve provider-specific time windows. Note that location timings must be configured before retrieving provider-specific windows.

        Each time window takes into account:
          - **Lead Time**: The preparation time required before an item can be picked.
          - **Packing Time**: The time needed to pack an order.

        This API enables flexible scheduling by providing a tailored view of available time windows, helping customers select suitable options for their operational needs.


      operationId: getSmartWindows
      tags:
        - Smart-Windows
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartWindowRequest'
            examples:
              GetSmartWindows:
                value:
                  locationExternalIds:
                    - '100983'
                  startDate: '2025-01-01'
                  numberOfDays: 2
                  types:
                    - delivery
                  categories:
                    - Prime
